<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- A test build: keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <title>KNOWN</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Noto+Sans+Myanmar:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap"
    />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <div class="app" id="app">
      <!-- Testers only. Explains where things are kept on the web. -->
      <div class="test-banner" id="test-banner" hidden></div>

      <header class="header" id="header"></header>

      <!-- The current screen is rendered here by js/router.js. -->
      <main class="screen" id="screen" tabindex="-1"></main>

      <!-- Sticky actions for the current screen (one primary button). -->
      <div class="actions" id="actions" hidden></div>

      <!-- Bottom tabs on Home, Moments and Settings. -->
      <nav class="tabs" id="tabs" hidden></nav>
    </div>

    <!-- Bottom sheets (Stop for now, Doesn't fit, Recover). -->
    <dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>

    <!-- Screen-reader announcements. -->
    <div class="sr-only" id="announcer" aria-live="polite"></div>

    <!-- Covers the page when the tab is hidden, so a task switcher doesn't show her words. -->
    <div class="privacy-cover" id="privacy-cover" hidden><div class="lamp lamp--lg"></div></div>

    <noscript>KNOWN needs JavaScript to run.</noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
