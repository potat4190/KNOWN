<!--
  Pray, step 3. The line she taps visibly joins the prayer card, quoted above
  the prayer. It is never inserted into the editable prayer: her edits stay hers.
-->
<div class="pray__who">
  <img class="pray__face" alt="" data-slot="face" />
  <div>
    <p class="secondary bold" data-slot="name"></p>
    <p class="footnote muted" data-slot="ref"></p>
  </div>
</div>
<h1 class="h1" tabindex="-1" data-t="pray_title"></h1>
<p class="lead" data-slot="lead"></p>
<div data-slot="tip"></div>
<div class="pray__lines" data-slot="lines" role="group"></div>
<label class="label" for="prayer-input" data-t="pray_label"></label>
<div class="pray__card" data-testid="prayer-card">
  <div class="pray__stay" data-slot="stay" data-testid="prayer-stay" hidden></div>
  <textarea id="prayer-input" class="pray__input reading" data-slot="input" data-testid="prayer-input" dir="auto"></textarea>
</div>
<p class="secondary muted" data-t="pray_sub"></p>
