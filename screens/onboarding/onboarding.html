<!-- First-run guide: four cards hosted by the lamp. Skip is visible from the first card. -->
<div class="onb__top"><button type="button" class="btn btn--quiet" data-slot="skip" data-t="tour_skip" data-testid="tour-skip"></button></div>
<div class="onb__track" data-slot="track">
  <section class="onb__card">
    <div class="onb__visual"><div class="lamp lamp--lg lamp--breathe" aria-hidden="true"></div></div>
    <h1 class="h1 center" tabindex="-1" data-t="tour1_title"></h1>
    <p class="lead center" data-t="w_sub"></p>
  </section>
  <section class="onb__card">
    <div class="onb__visual"><div class="onb__steps" data-slot="steps"></div></div>
    <h2 class="h1 center" data-t="tour2_title"></h2>
    <p class="lead center" data-t="tour2_body"></p>
  </section>
  <section class="onb__card">
    <div class="onb__visual"><div class="onb__badge" data-slot="lock"></div></div>
    <h2 class="h1 center" data-t="tour3_title"></h2>
    <p class="lead center" data-t="w_private"></p>
    <p class="lead center" data-t="tour3_more"></p>
  </section>
  <section class="onb__card">
    <div class="onb__visual"><div class="onb__badge" data-slot="help"></div></div>
    <h2 class="h1 center" data-t="tour4_title"></h2>
    <p class="lead center" data-t="tour4_body"></p>
  </section>
</div>
<div class="onb__dots" data-slot="dots" aria-hidden="true"></div>
