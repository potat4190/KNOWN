<!--
  Sit a little longer: a breathing lamp over the dimmed scene, with the
  breath prayer ("Breathe in" + line 1, "Breathe out" + line 2) changing with
  the 10-second cycle. With reduced motion both lines show and nothing moves.
-->
<h1 class="h1 center" tabindex="-1" data-t="sit_title"></h1>
<p class="lead center" data-slot="lead"></p>
<div class="sit__stage">
  <img class="sit__scene" alt="" data-slot="scene" />
  <div class="lamp lamp--lg lamp--breathe" aria-hidden="true"></div>
</div>
<div class="sit__cues" data-slot="cues"></div>
<div data-slot="toggle"></div>
