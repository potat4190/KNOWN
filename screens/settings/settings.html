<!-- Settings: language, appearance, the guide and tips, Help, sources, Delete everything. -->
<h1 class="h1" tabindex="-1" data-t="settings"></h1>

<section class="settings__section">
  <p class="label muted" data-t="lang_label"></p>
  <div class="chips" data-slot="langs"></div>
</section>

<section class="settings__section">
  <p class="label muted" data-t="theme_label"></p>
  <div data-slot="theme"></div>
</section>

<section class="settings__section">
  <p class="label muted" data-t="about_label"></p>
  <div data-slot="tour"></div>
  <div data-slot="tips"></div>

</section>

<div data-slot="help"></div>

<div class="card">
  <p class="secondary bold" data-t="sources_label"></p>
