<!-- Feel, step 1: choose one or two pictures, or write in your own words. -->
<h1 class="h1" tabindex="-1" data-slot="title"></h1>
<div data-slot="tabs"></div>
<div data-slot="tip"></div>
<section data-slot="pics" class="feel__panel">
  <p class="lead" data-t="pics_sub"></p>
  <div data-slot="grid"></div>
  <p class="secondary muted center" data-slot="count" aria-hidden="true">&nbsp;</p>
</section>
<section data-slot="words" class="feel__panel" hidden>
  <p class="lead" data-t="words_lead"></p>
  <textarea class="field" data-slot="input" data-testid="words-input" maxlength="1200" dir="auto" data-t-aria="words_label" data-t-ph="words_ph"></textarea>
  <div data-slot="ai-note"></div>
</section>
