<!--
  Reach out, step 4. She chooses who and what it says. KNOWN never sends
  anything for her: she copies it, or uses her phone's share sheet.
-->
<h1 class="h1" tabindex="-1" data-t="reach_title"></h1>
<p class="lead" data-t="reach_sub"></p>

<p class="label" data-t="to"></p>
<div class="chips" data-slot="to"></div>

<p class="label" data-t="need"></p>
<div class="chips" data-slot="need"></div>

<label class="label" for="msg-input" data-t="msg_label"></label>
<textarea id="msg-input" class="field" data-slot="msg" data-testid="msg-input" dir="auto"></textarea>
<p class="secondary muted" data-slot="edited" data-t="edits_kept" hidden></p>

<p class="label" data-t="reads_in"></p>
<div class="chips" data-slot="reader" role="radiogroup"></div>
<div data-slot="translate"></div>

<p class="status-line" data-slot="status" role="status"></p>
<p class="secondary muted" data-t="share_note"></p>
<div data-slot="keep"></div>
<div data-slot="back"></div>
